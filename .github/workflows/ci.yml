name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Metadados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar XML, JSON, pares -meta.xml, versao de API e credenciais
        run: python scripts/check_metadata.py

  lwc:
    name: Testes do LWC (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rodar os testes com cobertura
        run: npm run test:unit:coverage

  # Os testes Apex precisam de uma org. Este job so roda se o segredo SFDX_AUTH_URL existir
  # (veja docs/etapa-7-ci.md); sem ele, termina verde avisando que foi pulado. Usa "validate":
  # compila e roda todos os testes na org, mas NAO grava nada nela.
  apex:
    name: Testes Apex (validacao na org)
    runs-on: ubuntu-latest
    concurrency:
      group: apex-org
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Checar se ha org configurada
        id: gate
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Testes Apex pulados::Segredo SFDX_AUTH_URL nao configurado. Veja docs/etapa-7-ci.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: Instalar o Salesforce CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --global @salesforce/cli
      - name: Conectar na org
        if: steps.gate.outputs.enabled == 'true'
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          umask 077
          printf '%s' "$SFDX_AUTH_URL" > "$RUNNER_TEMP/auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth.txt" --alias ci
          rm -f "$RUNNER_TEMP/auth.txt"
      - name: Validar o deploy e rodar todos os testes (nao grava na org)
        if: steps.gate.outputs.enabled == 'true'
        run: sf project deploy validate --source-dir force-app --target-org ci --test-level RunLocalTests --wait 60
